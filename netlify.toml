[build]
  publish = "build/web"
  command = "flutter build web --release"

# Flutter web is a single-page app: unknown paths must fall back to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Hashed build artifacts can be cached aggressively
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/canvaskit/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Never cache the entry point, so new deploys are picked up immediately
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/flutter_service_worker.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Service worker and canvaskit need correct types / same-origin access
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
